[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-detection-ready"
version = "1.0.0"
description = "Train-ready frame and temporal deepfake detection pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=1.0",
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "tensorboard>=2.13",
  "tqdm>=4.65",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
export = ["onnx>=1.14", "onnxruntime>=1.15"]
dev = ["pytest>=8", "ruff>=0.6"]
legacy = ["mediapipe==0.10.21"]
web = [
  "fastapi>=0.115",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
deepfake-detect = "deepfake_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
